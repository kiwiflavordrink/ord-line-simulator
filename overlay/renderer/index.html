<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원랜디 오버레이</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <header id="drag">
    <span id="status">불러오는 중…</span>
    <span class="tools">
      <button id="btnCompact" title="접기/펼치기 (Ctrl+Shift+M)">▤</button>
      <button id="btnClick" title="마우스 통과 (Ctrl+Shift+O)">⇱</button>
      <button id="btnSettings" title="설정">⚙</button>
      <button id="btnQuit" title="종료">✕</button>
    </span>
  </header>

  <section id="settings" hidden>
    <label>헬퍼 Data 폴더 <span id="helperDir" class="path">-</span> <button id="pickHelper">찾기</button></label>
    <input id="helperFiles" type="file" webkitdirectory hidden>
    <label>입력
      <select id="source">
        <option value="memory">게임에서 자동 읽기</option>
        <option value="manual">직접 입력</option>
        <option value="log">헬퍼 기록 파일 감시</option>
        <option value="scenario">시나리오 재생</option>
      </select>
    </label>
    <label data-for="memory">플레이어 자리 <select id="memPlayer"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select> <span id="memLog" class="path">-</span></label>
    <label data-for="log">기록 파일 <span id="logFile" class="path">-</span> <button id="pickLog">찾기</button></label>
    <label data-for="scenario">시나리오 <span id="scenarioFile" class="path">-</span> <button id="pickScenario">찾기</button></label>
    <input id="scenarioInput" type="file" accept=".json" hidden>
    <label>난이도
      <select id="difficulty"><option value="auto">자동(기록 기준)</option><option>신</option><option>악몽</option><option>지옥</option></select>
    </label>
    <label>성장 방깎 <input id="growthCut" type="number" min="0" max="400" step="5" value="0"></label>
    <p class="hint">Ctrl+Shift+O 마우스 통과 · Ctrl+Shift+H 숨기기 · Ctrl+Shift+M 접기</p>
  </section>

  <section id="scenarioBar" hidden>
    <button id="prevFrame">◀</button><select id="frame"></select><button id="nextFrame">▶</button>
  </section>

  <section id="goal" class="card">
    <h2>목표 <select id="goalSelect"><option value="">(선택)</option></select></h2>
    <div id="goalBody" class="muted">목표 유닛을 고르면 부족 재료와 위습 수가 나옵니다.</div>
  </section>

  <section id="now" class="card">
    <h2>지금 조합 가능</h2>
    <div id="nowBody" class="muted">-</div>
  </section>

  <section id="next" class="card full">
    <h2>다음 목표 후보 (선택 위습으로 뽑을 흔함)</h2>
    <div id="catBar" class="catbar">
      <label><input type="checkbox" value="rare">희귀</label><label><input type="checkbox" value="legend">전설</label>
      <label><input type="checkbox" value="hidden">히든</label><label><input type="checkbox" value="upper">상위(초불영제)</label>
      <label><input type="checkbox" value="mystic">신비·기타</label><label><input type="checkbox" value="ship">해적선</label>
      <label><input type="checkbox" value="support">보조</label>
    </div>
    <div id="nextBody" class="muted">-</div>
  </section>

  <section id="combo" class="card">
    <h2>현재 조합</h2>
    <div id="comboBody" class="muted">보유 유닛이 없습니다.</div>
  </section>

  <section id="real" class="card full">
    <h2>비슷한 실제 클리어</h2>
    <div id="realBody" class="muted">헬퍼 Data 폴더를 지정하면 비교합니다.</div>
  </section>

  <section id="hand" class="card full">
    <h2>보유 유닛</h2>
    <div class="add"><input id="unitSearch" list="unitList" placeholder="유닛 이름 또는 코드"><datalist id="unitList"></datalist><button id="addUnit">추가</button><button id="clearHand">비우기</button></div>
    <div id="handBody"></div>
  </section>
</div>
<script type="module" src="app.mjs"></script>
</body>
</html>
